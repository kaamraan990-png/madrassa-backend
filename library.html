<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library | Darul Uloom Asufatul Islamia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body class="portal-page-body">
  <div class="page-shell portal-page-shell">
    <header class="portal-page-header">
      <a class="back-link" href="index.html">Home</a>
      <div>
        <p class="section-tag">Library</p>
        <h1 class="portal-page-title">Library Portal</h1>
        <p class="portal-page-copy">Browse available madrassa books, categories, and current resource availability.</p>
      </div>
    </header>

    <main class="portal-page-main">
      <section class="portal-section">
        <div class="data-grid" id="libraryList"></div>
      </section>
    </main>
  </div>
  <script>
    const root = document.documentElement;
    const API_BASE = window.location.origin;
    const savedTheme = localStorage.getItem("du-theme");
    const libraryList = document.getElementById("libraryList");

    if (savedTheme === "dark") {
      root.classList.add("dark-mode");
    }

    fetch(`${API_BASE}/api/library`)
      .then((response) => response.json())
      .then((data) => {
        libraryList.innerHTML = data.items.map((item) => `
          <article class="data-card">
            <p class="mini-tag">Library</p>
            <h4>${item.title}</h4>
            <p>${item.category}</p>
            <span class="pill">${item.availability}</span>
          </article>
        `).join("");
      })
      .catch(() => {
        libraryList.innerHTML = '<p class="form-status error">Unable to load library right now.</p>';
      });
  </script>
</body>
</html>
